# llama.cpp router-mode presets for pedrogpt (RTX 5090, sm_120, 32GB VRAM / 64GB RAM).
#
# Deployed to /etc/llama-server-models.ini by deploy-presets.sh.
#
# Router mode: llama-server is started WITHOUT -m/--model, so that process loads no
# model and never touches the GPU. Each section below is spawned as its own child
# llama-server process, inheriting the router's environment. Per-model flags therefore
# belong in a section, NOT in [*] — see the MTP note below for why that matters.
#
# VRAM: measured 27.9 GB / 32.6 GB for qwen3.6-27b-mtp alone at ctx 216064. Two 27B Q4
# models are 35.5 GB of weights before any KV cache, so they cannot be co-resident on a
# 32GB card at ANY context size. The unit sets --models-max 1 and models swap on demand.
# Because only one is ever resident, each keeps its full context.
#
# Cost of that choice: switching models unloads ~18 GB and reads ~18 GB off disk, so the
# first request after a switch stalls noticeably. Steady-state speed is unaffected.

# NOTE: deliberately no `version = 1` line here. Any key placed above the first section
# header is parsed into an implicit section and registers a phantom model named
# "default", which then shows up in /v1/models and in OpenWebUI's model picker and fails
# when selected. Verified on build b9802; upstream's docs/preset.md omits it too.
# The deprecated INIs in this directory still carry it — do not copy them.

# Shared defaults ONLY. Anything model-specific belongs in a section below.
# --metrics must reach each child: the router proxies /metrics to the child process.
[*]
flash-attn = on
no-webui   = true
metrics    = true
jinja      = true

# ---------------------------------------------------------------------------
# Model 1 — Qwen3.6-27B, MTP draft head baked into the GGUF.
#
# The section name is the API id. It is deliberately unchanged from single-model mode
# so every existing caller keeps working untouched: OpenWebUI (discovers via /v1/models),
# scripts/pedrogpt/benchmark, SuperAgentPedro, iam_pedro, pedro-bots.
#
# MTP note: spec-type/spec-draft-* live HERE and must never move to [*]. Qwen3.8 has no
# draft head, and inheriting these flags would crash that child on load.
# parallel = 1 is required by MTP and is preserved per-model — router children are
# separate processes, so this does not constrain the other model.
# ---------------------------------------------------------------------------
#
# Context headroom: this model is trained to 262144 (n_ctx_train) but runs at 216064,
# leaving 46080 tokens unused — hence the startup warning "n_ctx_seq (216064) <
# n_ctx_train (262144)". Raising it is plausible but NOT yet verified: measured usage
# is 27.95 GB at 216064, and extrapolating the non-weight cost (~46.5 MB per 1k tok)
# puts 262144 at ~30.1 GB of 32.6 GB — only ~2.5 GB headroom. Measure before raising;
# an OOM here takes down the primary model.
[qwen3.6-27b-mtp]
model                = /opt/models/qwen3.6-27b-mtp/Qwen3.6-27B-UD-Q4_K_XL.gguf
ctx-size             = 216064
n-gpu-layers         = -1
parallel             = 1
batch-size           = 2048
ubatch-size          = 1024
mlock                = true
cache-type-k         = q8_0
cache-type-v         = q8_0
spec-type            = draft-mtp
spec-draft-n-max     = 2
cache-type-k-draft   = q8_0
cache-type-v-draft   = q8_0
temp                 = 0.7
top-k                = 20
top-p                = 0.8
presence-penalty     = 1.5
min-p                = 0.0
chat-template-kwargs = {"enable_thinking":false}
load-on-startup      = true

# ---------------------------------------------------------------------------
# Model 2 — Qwen3.8-27B (dense, 17.56 GB), unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL.
#
# NOT an MTP model: the Q4_K_XL file has no draft head baked in (upstream ships one
# separately as MTP/mtp-Qwen3.8-27B-Q4_0.gguf). No spec-type here by design.
#
# No mlock: this is the model that gets evicted, and locking 17.5 GB fights the swap.
# Pre-downloaded to a local path rather than resolved via -hf at boot, so a systemd
# start never blocks on a 17.56 GB fetch under Restart=on-failure.
# ---------------------------------------------------------------------------
[qwen3.8-27b]
#
# Context: 262144 is this model's full native window (config.json
# max_position_embeddings). It is affordable because only 16 of 64 layers use full
# attention (full_attention_interval = 4; the other 48 are linear_attention and carry
# no growing KV cache). With 4 KV heads x 256 head_dim and q8_0 K/V, KV at 262144 is
# ~8.6 GB against a ~15 GB budget (32.6 GB card - 17.56 GB weights).
model            = /opt/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
ctx-size         = 262144
n-gpu-layers     = -1
# 4 slots with continuous batching so eval/bot requests decode together instead of
# queueing. kv-unified makes the 262144 ctx one shared pool (otherwise it is split
# 65536 per slot); it is only on by default when parallel is auto. Only the 16
# full-attention layers grow with ctx; per-slot recurrent state is small.
# Measured 2026-10-13 on b9802 under live eval traffic (3k-13k tok prompts, short
# replies): 5.4 -> 20.0 req/min, gen 17 -> 33 tok/s aggregate, queue 9 -> 0, VRAM
# +0.45 GB (27.7 / 32.6 GB). Per-request decode drops (~65 -> ~13 tok/s) because
# decode steps share batches with other slots' prompt chunks; aggregate is the win.
parallel         = 4
kv-unified       = true
batch-size       = 2048
ubatch-size      = 1024
cache-type-k     = q8_0
cache-type-v     = q8_0
# Reasoning effort. This model's own chat template accepts exactly three values —
# xhigh (its DEFAULT), medium, low — and raises on anything else. ('high' is silently
# remapped onto xhigh, so it is not a distinct tier.) Left unset the model reasons at
# xhigh on every request, which is why short max_tokens replies can come back empty:
# the whole budget goes to thinking. medium trades a little depth for latency.
chat-template-kwargs = {"reasoning_effort": "medium"}
temp             = 0.7
top-k            = 20
top-p            = 0.8
min-p            = 0.0
load-on-startup  = false

# ---------------------------------------------------------------------------
# Models 3-7 — OPTIONAL, ON-DEMAND. NOT YET DEPLOYED.
#
# All five are here so they are one request away even if rarely called. With
# load-on-startup = false and --models-max 1 they cost disk only (~18 GB each) until a
# request names them; the first call then evicts whatever is resident (~18 GB swap).
#
# DO NOT deploy these sections before llama.cpp is rebuilt. pedrogpt is on b9802;
# Muse Glimmer needs b10353 or newer (support merged 2026-08-10), and Nemotron 3.5's
# hybrid Mamba/MoE arch is likely newer than b9802 too (unverified). A child that cannot
# parse the GGUF just fails on load, but fix the build first so the failure is not
# what you debug later. Rebuild per docs/llama-cpp-build.md (CUDA 12.8,
# sm_120); re-run the qwen3.8 benchmark afterwards.
#
# Figures below are from atomic.chat's RTX 5090 guide (llama.cpp b10988, thinking off),
# NOT measured here. Sizes/ctx in the comments are theirs; re-measure VRAM before
# raising ctx-size. Filenames are the unsloth UD-Q4_K_XL pattern and MUST be checked
# against the downloaded files (ls /opt/models/<dir>/).
# ---------------------------------------------------------------------------

# Muse Glimmer 30B — dense, agentic (Meta reports 76.0% SWE-bench Verified). ~17.8 GiB
# at Q4, ~18.4 GiB VRAM at 32k ctx, ~74 tok/s. Uses reasoning tokens even at low
# effort: give callers a generous max_tokens. Sampling is the vendor's (unsloth guide).
# Download:
#   hf download unsloth/Muse-Glimmer-30B-GGUF --include '*UD-Q4_K_XL*' \
#       --local-dir /opt/models/muse-glimmer-30b
[muse-glimmer-30b]
model           = /opt/models/muse-glimmer-30b/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
ctx-size        = 131072
n-gpu-layers    = -1
parallel        = 1
batch-size      = 2048
ubatch-size     = 1024
cache-type-k    = q8_0
cache-type-v    = q8_0
temp            = 1.0
top-k           = 64
top-p           = 0.95
load-on-startup = false

# Nemotron 3.5 Lightning 30B-A3B — hybrid Mamba-2/attention MoE, ~3B active: the fast
# one (~334 tok/s, 15 s to first token at 128k). Up to 1M ctx supported by the model;
# 262144 here because it is plenty and hybrid layers keep KV small, but unmeasured.
# Weaker than Glimmer on agentic benchmarks (SWE-bench Verified 51.6% vs 76.0%), so
# this is the speed/long-document pick, not the coding-agent pick.
# Thinking-mode sampling per NVIDIA: temp 0.6, top-p 0.95.
# Download:
#   hf download unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF \
#       --include '*UD-Q4_K_XL*' --local-dir /opt/models/nemotron-3.5-lightning
[nemotron-3.5-lightning]
model           = /opt/models/nemotron-3.5-lightning/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_XL.gguf
ctx-size        = 262144
n-gpu-layers    = -1
parallel        = 1
batch-size      = 2048
ubatch-size     = 1024
cache-type-k    = q8_0
cache-type-v    = q8_0
temp            = 0.6
top-p           = 0.95
load-on-startup = false

# Gemma 4 31B it — dense, 30.7B, 60 layers. Best long-context accuracy of the 5090
# candidates (66.4% MRCR v2 at 128k vs 43-44% for the smaller Gemmas), at the price of
# VRAM and latency: ~17.4 GiB file (Q4_K_M), ~22.4 GiB at 32k but ~30.4 GiB at 128k on a
# 32.6 GiB card, ~69 tok/s, ~85 s to first token at 128k. That 128k figure leaves almost
# no headroom, so ctx-size is set to 65536 here; MEASURE before raising it, an OOM on
# load just fails this child but would waste a ~17 GB swap. q8_0 KV (below) should
# trim the article's number, which is not known to have used it.
# Sampling is the usual Gemma recommendation (temp 1.0, top-k 64, top-p 0.95),
# unverified against this exact release. Q4_K_M rather than UD-Q4_K_XL (18.8 GB) to
# keep VRAM down; the unsloth repo carries both.
# Download:
#   hf download unsloth/gemma-4-31B-it-GGUF --include '*Q4_K_M*' \
#       --local-dir /opt/models/gemma-4-31b-it
[gemma-4-31b-it]
model           = /opt/models/gemma-4-31b-it/gemma-4-31B-it-Q4_K_M.gguf
ctx-size        = 65536
n-gpu-layers    = -1
parallel        = 1
batch-size      = 2048
ubatch-size     = 1024
cache-type-k    = q8_0
cache-type-v    = q8_0
temp            = 1.0
top-k           = 64
top-p           = 0.95
load-on-startup = false

# Gemma 4 26B-A4B it — MoE, 25.2B total / ~4B active, 30 layers. The fast Gemma: ~249 tok/s,
# ~15.6 GiB file (Q4_K_M), ~17.7 GiB VRAM at 32k and ~19.8 GiB at 128k, 24 s to first token
# at 128k. Weaker long-context accuracy than the dense 31B (44.1% vs 66.4% MRCR v2 at 128k).
# ctx-size is 131072, the length the 19.8 GiB figure was measured at; native is 262144 but
# unmeasured here. Sampling is the usual Gemma recommendation, unverified for this release.
# Download (the repo also carries UD-Q4_K_XL):
#   hf download unsloth/gemma-4-26B-A4B-it-GGUF --include '*UD-Q4_K_M*' \
#       --local-dir /opt/models/gemma-4-26b-a4b-it
[gemma-4-26b-a4b-it]
model           = /opt/models/gemma-4-26b-a4b-it/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size        = 131072
n-gpu-layers    = -1
parallel        = 1
batch-size      = 2048
ubatch-size     = 1024
cache-type-k    = q8_0
cache-type-v    = q8_0
temp            = 1.0
top-k           = 64
top-p           = 0.95
load-on-startup = false

# Clef — ggml-org/Clef-GGUF, a 27B "decision model" finetuned from Cloudflare/clef, itself
# built on Qwen3.8-27B (so the same 16-of-64 full-attention layout: KV is small). It is
# NOT a chat model: it scores question/option spans and is meant to be called via the
# /v1/systemone API, not /v1/chat/completions.
# Needs llama.cpp PR #29831 (merged to master 2026-10-03, no release tag named on the PR),
# so the rebuild must be from a master that includes it. Apache-2.0.
# Q8_0 is 28.7 GB of a 32.6 GB card, leaving ~3.9 GB for KV and compute buffers: it should
# load, but only with a small ctx-size, which is fine for short decision prompts. Q4_K_M
# (19.5 GB) is the roomy fallback. Single sequence per batch, so parallel = 1.
# UNVERIFIED, check after the rebuild:
#   - whether router mode proxies /v1/systemone to this child (the PR does not say);
#   - the filename below, and that these flags are all it needs (the model card lists none);
#   - real VRAM at this ctx-size.
# Cost note: it cannot co-reside with any other model here, so every switch between Clef
# and a chat model is a 20-29 GB reload. Fine for occasional use, bad for a hot loop;
# ggml-org also publishes Clef-Flash-GGUF (size not checked) if this turns out too heavy.
# Download:
#   hf download ggml-org/Clef-GGUF --include '*Q8_0*' --local-dir /opt/models/clef
[clef]
model           = /opt/models/clef/Clef-Q8_0.gguf
ctx-size        = 16384
n-gpu-layers    = -1
parallel        = 1
batch-size      = 2048
ubatch-size     = 512
cache-type-k    = q8_0
cache-type-v    = q8_0
load-on-startup = false
