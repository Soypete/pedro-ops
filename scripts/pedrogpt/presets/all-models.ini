# llama.cpp model preset — Qwen3.6-27B MTP (single dedicated model)
# Hardware: 32GB VRAM (RTX 5090, sm_120) + 64GB RAM
#
# pedrogpt now runs ONE tuned model with Multi-Token Prediction (MTP).
# The live server is launched by /opt/llama.cpp/run-server.sh from /etc/llama-server.env
# (see setup-llama-cpp.sh) — NOT from this preset file. This file is kept only as a
# rollback artifact / reference for router (--models-preset) mode.
#
# MTP requires a single stream (parallel = 1); it cannot run in multi-slot router mode,
# so do not add other models here while MTP is active.

version = 1

[*]
n-gpu-layers = 99
jinja = true

# Qwen3.6-27B (dense) with the MTP draft head baked into the GGUF.
# UD-Q4_K_XL (~17.9 GB) fits fully in 32GB VRAM with room for the MTP head and a
# q8_0-quantized KV cache. Hybrid DeltaNet/GQA layers keep the KV cache small.
[qwen3.6-27b-mtp]
model = /opt/models/qwen3.6-27b-mtp/Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
ctx-size = 65536
flash-attn = true
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 0.7
top-k = 20
top-p = 0.8
presence-penalty = 1.5
min-p = 0.0
load-on-startup = true
