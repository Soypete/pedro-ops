# llama.cpp model preset: General-purpose text model
# Hardware: 32GB VRAM (RTX 5090) + 64GB RAM
#
# Primary: GLM-4.7-Flash — MoE 30B (3B active), UD-Q6_K_XL (~26.2 GB).
#   Benchmarks: AIME 25: 91.6, GPQA: 75.2, SWE-bench: 59.2
#   REQUIRES expert offload: -ot ".ffn_.*_exps.=CPU" --flash-attn
# Alternative: Nemotron-3-Super 120B-A12B — MoE (12B active), heavier reasoning.
#   Nemotron REQUIRES expert offload on the CLI: -ot ".ffn_.*_exps.=CPU" --flash-attn
#
# Download models first:
#   hf download unsloth/GLM-4.7-Flash-GGUF --include "*UD-Q6_K_XL*" --local-dir /opt/models/glm-4.7-flash
#   hf download unsloth/NVIDIA-Nemotron-3-Super-120B-A12B-GGUF --include "*UD-Q4_K_XL*" --local-dir /opt/models/nemotron-3-super-120b/UD-Q4_K_XL
#
# LiveBench: https://livebench.ai

version = 1

[*]
n-gpu-layers = -1
ctx-size = 8192
jinja = true

[glm-4.7-flash]
# MoE 30B (3B active), UD-Q6_K_XL ~26.2 GB — requires expert offload to RAM
# Benchmarks: AIME 25: 91.6, GPQA: 75.2, SWE-bench: 59.2
model = /opt/models/glm-4.7-flash/GLM-4.7-Flash-UD-Q6_K_XL.gguf
ctx-size = 32768
flash-attn = true
load-on-startup = true

[nemotron-3-super-120b]
# MoE 120B total, 12B active — strong reasoning. Q3_K_M (~52 GB) fits RAM better than Q4_K_XL (~77 GB).
# Requires full expert offload: -ot ".ffn_.*_exps.=CPU" --flash-attn
model = /opt/models/nemotron-3-super-120b/Q3_K_M/UD-Q3_K_M/NVIDIA-Nemotron-3-Super-120B-A12B-UD-Q3_K_M-00001-of-00003.gguf
ctx-size = 131072
flash-attn = true
no-mmap = true
parallel = 1
override-tensor = .ffn_.*_exps.=CPU
temp = 0.6
top-p = 0.95
