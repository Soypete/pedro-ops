# ScrapeConfig for llama.cpp running on pedrogpt (external to k8s cluster).
#
# pedrogpt runs a single dedicated model (Qwen3.6-27B MTP), so one ScrapeConfig
# is sufficient. (Router mode, which needed a ?model= param per model, is retired.)
#
# Apply to the monitoring namespace:
#   kubectl apply -f llama-cpp-scrapeconfig.yaml
#
# The kube-prometheus-stack is configured with:
#   serviceMonitorSelectorNilUsesHelmValues: false
# so it will pick up ScrapeConfigs in any namespace.
#
# pedrogpt is reachable from the cluster via Tailscale IP:
#   100.121.229.114  (use IP directly — cluster CoreDNS can't resolve ts.net)
#
# llama.cpp metrics documented at:
#   https://github.com/ggml-org/llama.cpp/blob/master/docs/server.md#prometheus-compatible-metrics
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: llama-cpp-qwen3-6-27b-mtp
  namespace: monitoring
  labels:
    app.kubernetes.io/name: llama-cpp
    app.kubernetes.io/instance: pedrogpt
    app.kubernetes.io/component: llm-server
spec:
  staticConfigs:
    - targets:
        - "100.121.229.114:8000"
      labels:
        job: llama-cpp
        instance: pedrogpt
        model: qwen3.6-27b-mtp
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 15s
