# Creates the Substack draft for the post book/substack/SCHEDULE.md dates
# today, Mon/Wed/Fri at 07:00 Mountain, and pings Discord #pedrogpt.
#
# No custom image: each run downloads main of the public ctx-eng-book repo
# (~6 MB) and runs scripts/substack_draft.py, which is stdlib-only. Merging to
# main is the deploy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: substack-draft
  namespace: ctx-eng-book
  labels:
    app.kubernetes.io/name: substack-draft
    app.kubernetes.io/part-of: ctx-eng-book
spec:
  schedule: "0 7 * * 1,3,5"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A retry after a partial failure could create a second draft; fail once
      # and let the Discord ping say so instead.
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: substack-draft
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: substack-draft
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              env:
                - name: REPO_TARBALL
                  value: https://codeload.github.com/Soypete/ctx-eng-book/tar.gz/refs/heads/main
              envFrom:
                # SUBSTACK_SESSION_COOKIE, DISCORD_SECRET, DISCORD_USER_ID
                - secretRef:
                    name: ctx-eng-book-secrets
              workingDir: /work
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  python3 -c 'import io, os, tarfile, urllib.request
                  data = urllib.request.urlopen(os.environ["REPO_TARBALL"], timeout=60).read()
                  tarfile.open(fileobj=io.BytesIO(data)).extractall("/work", filter="data")'
                  cd /work/ctx-eng-book-main
                  exec python3 scripts/substack_draft.py --scheduled
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
