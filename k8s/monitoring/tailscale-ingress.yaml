# Tailscale ingresses that expose Grafana and Prometheus on the tailnet
# (https://monitoring-<name>-ts-ingress.<tailnet>.ts.net), mirroring the
# existing Loki tailscale ingress. Reachable over Tailscale, unlike the
# *.local Contour ingresses which only resolve on the LAN.
#
# NOTE: the `tls:` block is REQUIRED. Without it the Tailscale operator sets up
# an HTTP-only proxy that expects the backend on 127.0.0.1:80, producing
# "could not connect to local backend server at 127.0.0.1:80" / ERR_CONNECTION_REFUSED
# for any backend not on port 80. With tls, the operator serves HTTPS and proxies
# to the real service port.
#
# Apply: kubectl apply -f k8s/monitoring/tailscale-ingress.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ts
  namespace: monitoring
  annotations:
    tailscale.com/hostname: grafana
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: grafana
      port:
        number: 80
  tls:
    - hosts:
        - grafana
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ts
  namespace: monitoring
  annotations:
    tailscale.com/hostname: prometheus
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-prometheus
      # Reference the port BY NAME: this service is multi-port
      # (http-web:9090 + reloader-web:8080).
      port:
        name: http-web
  tls:
    - hosts:
        - prometheus
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Replaces the older `loki` ingress (which lacked a tls block and so got the
  # long monitoring-loki-ingress.<tailnet>.ts.net name). This gives the clean
  # loki.<tailnet>.ts.net. You rarely hit Loki directly — Grafana queries it —
  # but this is handy for API/LogCLI access over the tailnet.
  name: loki-ts
  namespace: monitoring
  annotations:
    tailscale.com/hostname: loki
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: loki-gateway
      port:
        number: 80
  tls:
    - hosts:
        - loki
